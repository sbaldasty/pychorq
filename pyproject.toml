[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pychorq"
version = "0.1.0"
description = "Simulated quantum backend for uvm-plaid/pychor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "networkx>=3.4.2",
  "pychor",
  "qiskit-aer>=0.17.2",
  "qutip>=5.2.3",
  "qutip-qip>=0.4.1",
]

[project.optional-dependencies]
dev = [
  "matplotlib",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-q"
