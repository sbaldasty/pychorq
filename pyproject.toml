[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pychorq"
version = "0.1.0"
description = "Simulated quantum backend for uvm-plaid/pychor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pychor",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pychorq-hello = "pychorq.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
